name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (locked)
        run: uv sync --locked --extra dev

      - name: Lint with ruff
        run: uv run ruff check src/ tests/

      - name: Run tests
        run: uv run pytest -v --junitxml=report.xml

      - name: Report test failures as annotations
        if: failure()
        shell: bash
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("report.xml").getroot()
          for tc in root.iter("testcase"):
              for f in tc.findall("failure") + tc.findall("error"):
                  msg = ((f.get("message") or "") + " | " + (f.text or "")[-400:]).replace("\n", " ")[:900]
                  print(f"::error title={tc.get('classname')}.{tc.get('name')}::{msg}")
          PY
