[project]
name = "obsidian-mcp"
version = "1.0.0"
description = "MCP server exposing an Obsidian vault to LLM clients (Claude, Cursor, etc.)"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0,<2",
    "whoosh3>=3.49",
    "python-frontmatter>=1.1.0",
]

[project.scripts]
obsidian-mcp = "obsidian_mcp.server:main"

[project.urls]
Homepage = "https://github.com/nakielski/obsidian-mcp"
Repository = "https://github.com/nakielski/obsidian-mcp"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23", "mypy>=1.0", "ruff>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obsidian_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"examples" = "examples"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["obsidian_mcp"]
